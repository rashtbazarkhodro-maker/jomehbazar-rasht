<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درباره ما | جمعه بازار خودرو رشت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: #f5f6f8; color: #222; line-height: 1.8; }
  header { background: #1e3a5f; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header a { color: white; text-decoration: none; font-size: 1.3rem; }
  header h1 { font-size: 1rem; }
  .hero { background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); color: white; padding: 40px 20px; text-align: center; }
  .hero h2 { font-size: 1.4rem; margin-bottom: 8px; }
  .hero p { font-size: 0.9rem; opacity: 0.85; }
  .container { max-width: 700px; margin: 0 auto; padding: 16px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .card h3 { font-size: 1rem; color: #1e3a5f; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
  .card p { font-size: 0.9rem; color: #444; text-align: justify; }
  .card p + p { margin-top: 10px; }
  .info-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .info-row:last-child { border-bottom: none; }
  .info-icon { width: 42px; height: 42px; background: #f0f4f9; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .info-content { flex: 1; }
  .info-label { font-size: 0.75rem; color: #888; }
  .info-value { font-size: 0.9rem; font-weight: 600; color: #333; }
  .info-value a { color: #1e3a5f; text-decoration: none; }
  .features { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .feature { display: flex; gap: 10px; align-items: flex-start; font-size: 0.85rem; color: #444; }
  .feature .tick { color: #1e6b30; font-weight: 700; flex-shrink: 0; }
  .contact-buttons { display: flex; gap: 10px; margin-top: 14px; }
  .contact-buttons a { flex: 1; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
  .btn-call { background: #1e3a5f; color: white; }
  .btn-wa { background: #25d366; color: white; }
  .footer { text-align: center; padding: 20px; font-size: 0.75rem; color: #999; }
  .map-btn { display: block; text-align: center; padding: 14px; background: #f0f4f9; color: #1e3a5f; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
  .loading { text-align: center; padding: 40px 20px; color: #999; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <a href="/">→</a>
  <h1>درباره ما</h1>
</header>

<div class="hero" id="hero">
  <h2 id="heroTitle">...</h2>
  <p id="heroSubtitle"></p>
</div>

<div class="container" id="content">
  <div class="loading">در حال بارگذاری...</div>
</div>

<div class="footer">
  © جمعه بازار خودرو رشت — تمامی حقوق محفوظ است
</div>

<script>
function formatPhone(p) {
  if (!p) return '';
  const en = p.replace(/[^0-9]/g, '');
  return en.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

async function loadAbout() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    const s = data.settings || {};
    render(s);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading">خطا در بارگذاری</div>';
    console.error(e);
  }
}

function render(s) {
  document.getElementById('heroTitle').textContent = s.hero_title || 'جمعه بازار خودرو رشت';
  document.getElementById('heroSubtitle').textContent = s.hero_subtitle || '';

  const features = (s.about_features || '').split('|').filter(x => x.trim());
  const featuresHtml = features.map(f =>
    `<div class="feature"><span class="tick">✓</span> ${f}</div>`
  ).join('');

  const phone1 = s.phone1 || '';
  const phone2 = s.phone2 || '';
  const whatsapp = s.whatsapp || '';
  const waLink = whatsapp ? `https://wa.me/${whatsapp.replace(/[^0-9]/g, '')}` : '#';

  document.getElementById('content').innerHTML = `
    <div class="card">
      <h3><span class="icon">🚗</span> ما کی هستیم؟</h3>
      <p>${s.about_intro || ''}</p>
      ${s.about_intro2 ? `<p>${s.about_intro2}</p>` : ''}
    </div>

    ${features.length ? `
    <div class="card">
      <h3><span class="icon">✨</span> چرا ما؟</h3>
      <div class="features">${featuresHtml}</div>
    </div>
    ` : ''}

    <div class="card">
      <h3><span class="icon">📞</span> راه‌های ارتباطی</h3>
      ${phone1 ? `
      <div class="info-row">
        <div class="info-icon">📱</div>
        <div class="info-content">
          <div class="info-label">تماس و واتساپ</div>
          <div class="info-value"><a href="tel:${phone1}">${formatPhone(phone1)}</a></div>
        </div>
      </div>` : ''}
      ${phone2 ? `
      <div class="info-row">
        <div class="info-icon">📞</div>
        <div class="info-content">
          <div class="info-label">تلفن ثابت</div>
          <div class="info-value"><a href="tel:${phone2}">${formatPhone(phone2)}</a></div>
        </div>
      </div>` : ''}
      ${s.address ? `
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div class="info-content">
          <div class="info-label">آدرس</div>
          <div class="info-value">${s.address}</div>
        </div>
      </div>` : ''}
      ${s.hours ? `
      <div class="info-row">
        <div class="info-icon">🕐</div>
        <div class="info-content">
          <div class="info-label">ساعت کاری</div>
          <div class="info-value">${s.hours}</div>
        </div>
      </div>` : ''}

      <div class="contact-buttons">
        ${phone1 ? `<a class="btn-call" href="tel:${phone1}">📞 تماس</a>` : ''}
        ${whatsapp ? `<a class="btn-wa" href="${waLink}" target="_blank">واتساپ</a>` : ''}
      </div>
    </div>

    ${s.map_url ? `
    <div class="card">
      <h3><span class="icon">📍</span> موقعیت روی نقشه</h3>
      <a class="map-btn" href="${s.map_url}" target="_blank">🗺️ مشاهده در گوگل مپ</a>
    </div>
    ` : ''}

    <div class="card">
      <h3><span class="icon">📝</span> می‌خوای خودروت رو بفروشی؟</h3>
      <p style="margin-bottom:14px;">کافیه اطلاعات خودروت رو از طریق فرم ثبت آگهی برامون بفرستی.</p>
      <a href="submit.html" style="display:block;padding:12px;background:#ffb703;color:#1e3a5f;text-decoration:none;text-align:center;border-radius:10px;font-weight:700;font-size:0.9rem;">+ ثبت آگهی خودرو</a>
    </div>
  `;
}

loadAbout();
</script>
</body>
</html>
