<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جمعه بازار خودرو رشت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1e3a5f;
    --primary-light: #2c5282;
    --accent: #ffb703;
    --success: #1e6b30;
    --bg: #ffffff;
    --text: #1a202c;
    --text-muted: #64748b;
    --border: #e5e7eb;
  }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: #f5f6f8;
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
    color: white;
    padding: 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  }
  .header-content { position: relative; z-index: 2; }
  .logo-circle {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 1.05rem;
    font-weight: 800;
    margin-bottom: 2px;
  }
  header .tagline {
    font-size: 0.75rem;
    opacity: 0.85;
  }
  .nav-links {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }
  .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.12);
  }
  .nav-links a:active { background: rgba(255,255,255,0.25); }
  .nav-links a.btn-accent {
    background: var(--accent);
    color: var(--primary);
  }

  /* ===== Search Bar ===== */
  .search-bar {
    padding: 10px 12px;
    background: white;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    gap: 8px;
    align-items: center;
    max-width: 700px;
    margin: 0 auto;
  }
  .search-input-wrap {
    flex: 1;
    position: relative;
  }
  .search-input-wrap::before {
    content: '🔍';
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    pointer-events: none;
  }
  .search-bar input {
    width: 100%;
    padding: 10px 34px 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.85rem;
    background: #fafafa;
  }
  .search-bar input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
  }
  .filter-toggle {
    padding: 10px 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    position: relative;
  }
  .filter-toggle.has-filter::after {
    content: '';
    position: absolute;
    top: 5px; right: 5px;
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ===== Sort Bar ===== */
  .sort-bar {
    padding: 8px 12px;
    background: white;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
    max-width: 700px;
    margin: 0 auto;
  }
  .sort-bar::-webkit-scrollbar { display: none; }
  .sort-chip {
    padding: 6px 12px;
    background: #f1f5f9;
    border: 1px solid transparent;
    border-radius: 16px;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    white-space: nowrap;
  }
  .sort-chip.active {
    background: var(--primary);
    color: white;
  }

  .result-count {
    padding: 10px 14px 4px;
    font-size: 0.75rem;
    color: var(--text-muted);
    max-width: 700px;
    margin: 0 auto;
  }

  /* ===== Cars List ===== */
  .cars-list {
    background: white;
    max-width: 700px;
    margin: 0 auto;
    padding: 0;
  }

  .car-row {
    display: flex;
    gap: 12px;
    padding: 14px 12px;
    border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
    transition: background 0.15s;
    align-items: flex-start;
  }
  .car-row:active { background: #f8fafc; }

  /* عکس سمت چپ */
  .car-image {
    position: relative;
    width: 130px;
    height: 100px;
    border-radius: 10px;
    overflow: hidden;
    background: #e5e7eb;
    flex-shrink: 0;
  }
  .car-image img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-count {
    position: absolute;
    top: 6px; left: 6px;
    background: rgba(0,0,0,0.65);
    color: white;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    backdrop-filter: blur(6px);
  }

  /* اطلاعات سمت راست */
  .car-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .car-title {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .car-mileage {
    font-size: 0.82rem;
    color: #475569;
    font-weight: 500;
  }
  .car-price {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--primary);
    margin-top: 2px;
  }
  .car-desc {
    font-size: 0.78rem;
    color: #64748b;
    line-height: 1.5;
    margin-top: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .empty, .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
    background: white;
  }
  .empty .icon { font-size: 3rem; display: block; margin-bottom: 12px; opacity: 0.5; }

  /* ===== Filter Panel ===== */
  .filter-panel {
    position: fixed;
    bottom: -100%; left: 0; right: 0;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    z-index: 1000;
    transition: bottom 0.35s ease-out;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
  }
  .filter-panel.open { bottom: 0; }
  .filter-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .filter-overlay.open { opacity: 1; pointer-events: auto; }

  .filter-handle {
    width: 40px; height: 4px;
    background: #cbd5e1;
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .filter-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .filter-header h3 { font-size: 1.05rem; color: var(--primary); font-weight: 700; }
  .filter-close {
    background: #f1f5f9;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: #64748b;
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .filter-group { margin-bottom: 18px; }
  .filter-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: #334155;
    margin-bottom: 10px;
  }
  .range-inputs { display: flex; gap: 8px; align-items: center; }
  .range-inputs input {
    flex: 1;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.88rem;
    text-align: center;
    background: #fafafa;
  }
  .range-inputs input:focus { outline: none; border-color: var(--primary); background: white; }
  .range-inputs span { color: #94a3b8; font-size: 0.8rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 9px 16px;
    background: #f1f5f9;
    border: 1.5px solid transparent;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
  }
  .chip.active { background: var(--primary); color: white; }
  .filter-actions {
    display: flex; gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .btn-reset {
    flex: 1;
    padding: 14px;
    background: #f1f5f9;
    color: #475569;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-apply {
    flex: 2;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo-circle">🚗</div>
    <h1 id="headerTitle">جمعه بازار خودرو رشت</h1>
    <p class="tagline" id="headerTagline">نمایشگاه خودروهای سبک و سنگین</p>
  </div>
  <div class="nav-links">
    <a href="/">🏠 خانه</a>
    <a href="about.html">ℹ️ درباره ما</a>
    <a href="install.html">📱 نصب اپ</a>
    <a href="submit.html" class="btn-accent">+ ثبت آگهی</a>
  </div>
</header>

<div class="search-bar">
  <div class="search-input-wrap">
    <input type="text" id="searchInput" placeholder="جستجوی برند یا مدل...">
  </div>
  <button class="filter-toggle" id="filterToggle">⚙️</button>
</div>

<div class="sort-bar" id="sortBar">
  <button class="sort-chip active" data-sort="newest">🆕 جدیدترین</button>
  <button class="sort-chip" data-sort="cheapest">💰 ارزان‌ترین</button>
  <button class="sort-chip" data-sort="expensive">💎 گران‌ترین</button>
  <button class="sort-chip" data-sort="lowMileage">🛣️ کم‌کارکرد</button>
  <button class="sort-chip" data-sort="newestYear">📅 جدیدترین سال</button>
</div>

<div class="result-count" id="resultCount"></div>
<div class="cars-list" id="carsList">
  <div class="loading">در حال بارگذاری...</div>
</div>

<div class="filter-overlay" id="filterOverlay"></div>
<div class="filter-panel" id="filterPanel">
  <div class="filter-handle"></div>
  <div class="filter-header">
    <h3>فیلترها</h3>
    <button class="filter-close" id="filterClose">×</button>
  </div>

  <div class="filter-group">
    <label>قیمت (تومان)</label>
    <div class="range-inputs">
      <input type="number" id="priceMin" placeholder="از" min="0">
      <span>—</span>
      <input type="number" id="priceMax" placeholder="تا" min="0">
    </div>
  </div>

  <div class="filter-group">
    <label>سال ساخت</label>
    <div class="range-inputs">
      <input type="number" id="yearMin" placeholder="از" min="1370" max="1410">
      <span>—</span>
      <input type="number" id="yearMax" placeholder="تا" min="1370" max="1410">
    </div>
  </div>

  <div class="filter-group">
    <label>گیربکس</label>
    <div class="chips" id="gearboxChips">
      <button type="button" class="chip" data-val="دستی">دستی</button>
      <button type="button" class="chip" data-val="اتوماتیک">اتوماتیک</button>
    </div>
  </div>

  <div class="filter-group">
    <label>سوخت</label>
    <div class="chips" id="fuelChips">
      <button type="button" class="chip" data-val="بنزین">بنزین</button>
      <button type="button" class="chip" data-val="دیزل">دیزل</button>
      <button type="button" class="chip" data-val="دوگانه‌سوز">دوگانه‌سوز</button>
      <button type="button" class="chip" data-val="برقی">برقی</button>
      <button type="button" class="chip" data-val="هیبرید">هیبرید</button>
    </div>
  </div>

  <div class="filter-actions">
    <button type="button" class="btn-reset" id="filterReset">پاک کردن</button>
    <button type="button" class="btn-apply" id="filterApply">اعمال فیلتر</button>
  </div>
</div>

<script>
const API_URL = '/api/cars';
let allCars = [];

const filters = {
  priceMin: null, priceMax: null,
  yearMin: null, yearMax: null,
  gearbox: null, fuel: null
};

let currentSort = 'newest';

function faNum(n) {
  return (n || 0).toLocaleString('fa-IR');
}

const list = document.getElementById('carsList');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const filterPanel = document.getElementById('filterPanel');
const filterOverlay = document.getElementById('filterOverlay');
const filterToggle = document.getElementById('filterToggle');

function sortCars(cars) {
  const sorted = cars.slice();
  switch (currentSort) {
    case 'newest': return sorted.sort((a, b) => b.id - a.id);
    case 'cheapest': return sorted.sort((a, b) => a.price - b.price);
    case 'expensive': return sorted.sort((a, b) => b.price - a.price);
    case 'lowMileage': return sorted.sort((a, b) => a.mileage - b.mileage);
    case 'newestYear': return sorted.sort((a, b) => b.year - a.year);
    default: return sorted;
  }
}

function renderCars(cars) {
  list.innerHTML = '';
  if (cars.length === 0) {
    list.innerHTML = '<div class="empty"><span class="icon">🔍</span>خودرویی با این مشخصات پیدا نشد</div>';
    resultCount.textContent = '';
    return;
  }
  resultCount.textContent = faNum(cars.length) + ' آگهی';

  cars.forEach(car => {
    let images = [];
    try { images = JSON.parse(car.images || '[]'); } catch (e) {}
    const imgUrl = images[0] || 'https://via.placeholder.com/400x300?text=No+Image';
    const imgCount = images.length || 0;

    const el = document.createElement('div');
    el.className = 'car-row';
    el.innerHTML = `
      <div class="car-image">
        <img src="${imgUrl}" alt="${car.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
        ${imgCount > 0 ? `<div class="photo-count">📷 ${faNum(imgCount)}</div>` : ''}
      </div>
      <div class="car-info">
        <div class="car-title">${car.title}</div>
        <div class="car-mileage">${faNum(car.mileage)} کیلومتر</div>
        <div class="car-price">${faNum(car.price)} تومان</div>
        ${car.description ? `<div class="car-desc">${car.description}</div>` : ''}
      </div>
    `;
    el.addEventListener('click', () => {
      window.location.href = 'car.html?id=' + car.id;
    });
    list.appendChild(el);
  });
}

function applyFilters() {
  const query = searchInput.value.trim().toLowerCase();
  let filtered = allCars.slice();

  if (query) {
    filtered = filtered.filter(car =>
      (car.title && car.title.toLowerCase().includes(query)) ||
      (car.brand && car.brand.toLowerCase().includes(query)) ||
      (car.model && car.model.toLowerCase().includes(query))
    );
  }
  if (filters.priceMin != null) filtered = filtered.filter(c => c.price >= filters.priceMin);
  if (filters.priceMax != null) filtered = filtered.filter(c => c.price <= filters.priceMax);
  if (filters.yearMin != null) filtered = filtered.filter(c => c.year >= filters.yearMin);
  if (filters.yearMax != null) filtered = filtered.filter(c => c.year <= filters.yearMax);
  if (filters.gearbox) filtered = filtered.filter(c => c.gearbox === filters.gearbox);
  if (filters.fuel) filtered = filtered.filter(c => c.fuel === filters.fuel);

  filtered = sortCars(filtered);
  renderCars(filtered);

  const hasFilter = filters.priceMin != null || filters.priceMax != null ||
                    filters.yearMin != null || filters.yearMax != null ||
                    filters.gearbox || filters.fuel;
  filterToggle.classList.toggle('has-filter', hasFilter);
}

filterToggle.addEventListener('click', () => {
  filterPanel.classList.add('open');
  filterOverlay.classList.add('open');
});
filterOverlay.addEventListener('click', closeFilter);
document.getElementById('filterClose').addEventListener('click', closeFilter);
function closeFilter() {
  filterPanel.classList.remove('open');
  filterOverlay.classList.remove('open');
}

function setupChips(containerId, filterKey) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.val;
      if (chip.classList.contains('active')) {
        chip.classList.remove('active');
        filters[filterKey] = null;
      } else {
        container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filters[filterKey] = val;
      }
    });
  });
}
setupChips('gearboxChips', 'gearbox');
setupChips('fuelChips', 'fuel');

document.getElementById('filterApply').addEventListener('click', () => {
  filters.priceMin = document.getElementById('priceMin').value ? parseInt(document.getElementById('priceMin').value) : null;
  filters.priceMax = document.getElementById('priceMax').value ? parseInt(document.getElementById('priceMax').value) : null;
  filters.yearMin = document.getElementById('yearMin').value ? parseInt(document.getElementById('yearMin').value) : null;
  filters.yearMax = document.getElementById('yearMax').value ? parseInt(document.getElementById('yearMax').value) : null;
  applyFilters();
  closeFilter();
});

document.getElementById('filterReset').addEventListener('click', () => {
  filters.priceMin = null; filters.priceMax = null;
  filters.yearMin = null; filters.yearMax = null;
  filters.gearbox = null; filters.fuel = null;
  document.getElementById('priceMin').value = '';
  document.getElementById('priceMax').value = '';
  document.getElementById('yearMin').value = '';
  document.getElementById('yearMax').value = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  applyFilters();
});

searchInput.addEventListener('input', applyFilters);

document.querySelectorAll('#sortBar .sort-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#sortBar .sort-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentSort = chip.dataset.sort;
    applyFilters();
  });
});

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    const s = data.settings || {};
    if (s.hero_title) document.getElementById('headerTitle').textContent = s.hero_title;
    if (s.hero_subtitle) document.getElementById('headerTagline').textContent = s.hero_subtitle;
  } catch (e) {}
}

async function loadCars() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    allCars = data.cars || [];
    applyFilters();
  } catch (e) {
    list.innerHTML = '<div class="empty"><span class="icon">⚠️</span>خطا در بارگذاری</div>';
    console.error(e);
  }
}

loadSettings();
loadCars();
</script>
</body>
</html>
