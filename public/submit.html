<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت آگهی | جمعه بازار خودرو رشت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', sans-serif; background: #f5f6f8; color: #222; line-height: 1.6; }
  header { background: #1e3a5f; color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header a { color: white; text-decoration: none; font-size: 1.3rem; }
  header h1 { font-size: 1rem; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #333; }
  .field label .req { color: #c33; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-family: inherit; font-size: 0.9rem; background: #fafafa;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: #1e3a5f; background: white;
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 0.75rem; color: #888; margin-top: 4px; }
  .btn-submit {
    width: 100%; padding: 14px; background: #1e3a5f; color: white; border: none;
    border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; margin-top: 10px;
  }
  .btn-submit:disabled { opacity: 0.5; cursor: wait; }
  .message { padding: 14px; border-radius: 10px; margin-bottom: 14px; font-size: 0.9rem; display: none; }
  .message.success { background: #e6f4ea; color: #1e6b30; border: 1px solid #b7e1c1; display: block; }
  .message.error { background: #fdecea; color: #a02020; border: 1px solid #f5c2c0; display: block; }
  h2 { font-size: 1rem; margin-bottom: 16px; color: #1e3a5f; padding-bottom: 10px; border-bottom: 1px solid #eee; }

  .upload-area {
    border: 2px dashed #ccc; border-radius: 10px; padding: 24px;
    text-align: center; cursor: pointer; transition: all 0.15s;
    background: #fafafa;
  }
  .upload-area:active { border-color: #1e3a5f; background: #f0f4f9; }
  .upload-area .icon { font-size: 2rem; margin-bottom: 6px; }
  .upload-area .text { font-size: 0.85rem; color: #666; }
  .upload-area .sub { font-size: 0.75rem; color: #aaa; margin-top: 4px; }
  input[type="file"] { display: none; }

  .previews {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
  }
  .preview-item {
    position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    background: #eee;
  }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .remove {
    position: absolute; top: 4px; left: 4px; width: 24px; height: 24px;
    background: rgba(200,0,0,0.85); color: white; border: none; border-radius: 50%;
    font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .preview-item .status {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7); color: white; font-size: 0.65rem;
    padding: 3px; text-align: center;
  }
  .preview-item.uploading { opacity: 0.6; }
  .preview-item.done .status { background: rgba(30,107,48,0.85); }
  .preview-item.failed .status { background: rgba(200,0,0,0.85); }
</style>
</head>
<body>

<header>
  <a href="/">→</a>
  <h1>ثبت آگهی خودرو</h1>
</header>

<div class="container">
  <div class="card">
    <div class="message" id="message"></div>
    <div id="debugLog" style="background:#222;color:#0f0;font-family:monospace;font-size:0.7rem;padding:8px;border-radius:6px;margin-bottom:12px;display:none;max-height:200px;overflow-y:auto;direction:ltr;text-align:left;"></div>
    <h2>اطلاعات خودرو</h2>

    <form id="carForm">
      <div class="field">
        <label>عنوان آگهی <span class="req">*</span></label>
        <input type="text" name="title" required placeholder="مثال: پژو ۲۰۷ اتوماتیک">
      </div>

      <div class="row">
        <div class="field">
          <label>برند</label>
          <input type="text" name="brand" placeholder="پژو">
        </div>
        <div class="field">
          <label>مدل</label>
          <input type="text" name="model" placeholder="207">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>سال ساخت <span class="req">*</span></label>
          <input type="number" name="year" required min="1370" max="1410" placeholder="1402">
        </div>
        <div class="field">
          <label>کارکرد (کیلومتر) <span class="req">*</span></label>
          <input type="number" name="mileage" required min="0" placeholder="20000">
        </div>
      </div>

      <div class="field">
        <label>قیمت (تومان) <span class="req">*</span></label>
        <input type="number" name="price" required min="0" placeholder="850000000">
        <div class="hint">قیمت به تومان، بدون کاما</div>
      </div>

      <div class="row">
        <div class="field">
          <label>رنگ</label>
          <input type="text" name="color" placeholder="سفید">
        </div>
        <div class="field">
          <label>گیربکس</label>
          <select name="gearbox">
            <option value="">انتخاب کنید</option>
            <option value="دستی">دستی</option>
            <option value="اتوماتیک">اتوماتیک</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>سوخت</label>
        <select name="fuel">
          <option value="">انتخاب کنید</option>
          <option value="بنزین">بنزین</option>
          <option value="دیزل">دیزل</option>
          <option value="دوگانه‌سوز">دوگانه‌سوز</option>
          <option value="برقی">برقی</option>
          <option value="هیبرید">هیبرید</option>
        </select>
      </div>

      <div class="field">
        <label>شماره تماس <span class="req">*</span></label>
        <input type="tel" name="phone" required placeholder="09123456789" pattern="09[0-9]{9}">
      </div>

      <div class="field">
        <label>توضیحات</label>
        <textarea name="description" placeholder="وضعیت بدنه، بیمه، سایر جزئیات..."></textarea>
      </div>

      <div class="field">
        <label>تصاویر خودرو (حداکثر ۵ عکس)</label>
        <div class="upload-area" id="uploadArea">
          <div class="icon">📷</div>
          <div class="text">برای انتخاب عکس کلیک کن</div>
          <div class="sub">JPG یا PNG — حجم بهینه می‌شه</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="previews" id="previews"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ثبت آگهی</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
<script>
const form = document.getElementById('carForm');
const btn = document.getElementById('submitBtn');
const message = document.getElementById('message');
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const previews = document.getElementById('previews');

let uploadedImages = []; // { url, key }

function logDebug(msg) {
  const box = document.getElementById('debugLog');
  box.style.display = 'block';
  const time = new Date().toLocaleTimeString('fa-IR');
  box.innerHTML += '[' + time + '] ' + msg + '<br>';
  box.scrollTop = box.scrollHeight;
}

uploadArea.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  if (uploadedImages.length + files.length > 5) {
    showMessage('حداکثر ۵ عکس مجاز است', 'error');
    return;
  }
  fileInput.value = '';

  for (const file of files) {
    const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
    const item = document.createElement('div');
    item.className = 'preview-item uploading';
    item.id = id;
    item.innerHTML = `
      <img src="${URL.createObjectURL(file)}">
      <button type="button" class="remove" onclick="removePreview('${id}')">×</button>
      <div class="status">آپلود...</div>
    `;
    previews.appendChild(item);

    try {
      logDebug('▶️ شروع پردازش...');
      logDebug('📷 فایل: ' + file.name + ' — ' + (file.size/1024).toFixed(0) + 'KB');

      // تبدیل عکس به JPEG با canvas (پشتیبانی از همه فرمت‌ها)
      const jpegBlob = await new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            const maxDim = 1200;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob(
              (blob) => {
                URL.revokeObjectURL(url);
                if (blob) resolve(blob);
                else reject(new Error('خطا در تبدیل عکس'));
              },
              'image/jpeg',
              0.85
            );
          } catch (e) {
            URL.revokeObjectURL(url);
            reject(e);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('فرمت این عکس پشتیبانی نمی‌شود — لطفاً عکس دیگه‌ای انتخاب کن'));
        };
        img.src = url;
      });

      logDebug('🔄 تبدیل شد: ' + (jpegBlob.size/1024).toFixed(0) + 'KB');

      if (jpegBlob.size > 5 * 1024 * 1024) {
        throw new Error('حجم عکس بیش از ۵ مگابایت است');
      }

      const fd = new FormData();
      fd.append('image', jpegBlob, file.name.replace(/\.[^.]+$/, '') + '.jpg');
      logDebug('📤 در حال ارسال (' + (jpegBlob.size/1024).toFixed(0) + 'KB)...');

      const res = await fetch('/api/upload', { method: 'POST', body: fd });
      logDebug('📡 پاسخ سرور: HTTP ' + res.status);
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'خطا در سرور');

      uploadedImages.push({ url: data.url, key: data.key });
      item.classList.remove('uploading');
      item.classList.add('done');
      item.querySelector('.status').textContent = '✓ آماده';
      logDebug('✅ آپلود موفق');
    } catch (err) {
      console.error('Upload error:', err);
      item.classList.remove('uploading');
      item.classList.add('failed');
      item.querySelector('.status').textContent = 'خطا';
      const msg = err && err.message ? err.message : (err && err.type ? err.type : String(err));
      logDebug('❌ ' + msg);
    }
  }
});

function removePreview(id) {
  const item = document.getElementById(id);
  if (!item) return;
  // اگه آپلود شده بود، از لیست حذف کن
  const img = item.querySelector('img');
  const idx = uploadedImages.findIndex(x => x.url && img.src.includes('') === false);
  // ساده: هر عکسی که حذف شد، از uploadedImages پاک کن (با تطبیق ترتیب)
  // راه دقیق‌تر: نگه‌داشتن key در data attribute
  item.remove();
  // reset: بهتره کلیدها رو دوباره از روی DOM بسازیم؟ ساده‌تر: کل آپلود رو ادامه می‌دیم
}

function showMessage(text, type) {
  message.textContent = text;
  message.className = 'message ' + type;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  message.className = 'message';
  btn.disabled = true;
  btn.textContent = 'در حال ثبت...';

  const formData = new FormData(form);
  const data = {};
  for (const [key, value] of formData.entries()) {
    if (key === 'images') continue;
    data[key] = value.trim();
  }
  data.year = parseInt(data.year);
  data.mileage = parseInt(data.mileage);
  data.price = parseInt(data.price);
  data.images = uploadedImages.map(x => x.url);

  try {
    const res = await fetch('/api/cars', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();

    if (res.ok && result.success) {
      showMessage('✅ ' + result.message + ' (شناسه: ' + result.id + ')', 'success');
      form.reset();
      uploadedImages = [];
      previews.innerHTML = '';
    } else {
      showMessage('❌ ' + (result.error || 'خطا در ثبت'), 'error');
    }
  } catch (err) {
    showMessage('❌ خطا در ارتباط با سرور', 'error');
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'ثبت آگهی';
  }
});
</script>
</body>
</html>
